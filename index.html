<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>투두리스트</title>

  <!-- PWA 설정 -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#6355df">

  <!-- iPhone 홈 화면 설치 설정 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="투두리스트">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 64px 20px;
      font-family: system-ui, sans-serif;
      color: #273248;
      background:
        radial-gradient(circle at 15% 0%, #e5eaff, transparent 45%),
        #f5f7fb;
    }

    main {
      width: 100%;
      max-width: 560px;
      margin: auto;
      padding: 36px;
      border: 1px solid white;
      border-radius: 24px;
      background: white;
      box-shadow: 0 16px 48px #28365a12;
    }

    h1 {
      margin: 0 0 28px;
      font-size: clamp(24px, 5vw, 30px);
      letter-spacing: -1px;
    }

    form, .filters {
      display: flex;
      gap: 8px;
    }

    .filters {
      padding: 5px;
      margin-bottom: 24px;
      border-radius: 14px;
      background: #f1f4f9;
    }

    button {
      min-height: 44px;
      padding: 10px 16px;
      border: none;
      border-radius: 10px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      touch-action: manipulation;
      transition:
        transform .18s ease,
        background-color .2s ease,
        color .2s ease,
        box-shadow .2s ease;
    }

    button:active { transform: scale(.95); }

    .filters button {
      flex: 1;
      background: transparent;
      color: #65718a;
    }

    .filters button[aria-pressed="true"] {
      background: white;
      color: #5146d8;
      box-shadow: 0 2px 8px #28365a10;
    }

    input[type="text"] {
      flex: 1;
      min-width: 0;
      padding: 14px;
      border: 1px solid #dce2ec;
      border-radius: 12px;
      background: #fbfcfe;
      color: inherit;
      font: inherit;
      font-size: 16px;
      transition: border-color .2s ease, box-shadow .2s ease;
    }

    input[type="text"]:focus {
      border-color: #857cee;
      box-shadow: 0 0 0 3px #7569e514;
    }

    .add {
      background: #6355df;
      color: white;
      box-shadow: 0 4px 12px #6355df24;
    }

    ul {
      display: grid;
      gap: 10px;
      list-style: none;
      padding: 0;
      margin: 24px 0 0;
    }

    li {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px;
      border: 1px solid #e7ebf2;
      border-radius: 14px;
      background: white;
      box-shadow: 0 3px 10px #28365a05;
      animation: item-enter .3s ease-out;
    }

    li[hidden] { display: none; }

    label {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 0;
      min-height: 44px;
      cursor: pointer;
    }

    input[type="checkbox"] {
      width: 20px;
      height: 20px;
      margin: 0;
      flex-shrink: 0;
      accent-color: #6355df;
      cursor: pointer;
    }

    li span {
      line-height: 1.6;
      overflow-wrap: anywhere;
      transition: color .2s ease;
    }

    input:checked + span {
      color: #9aa4b5;
      text-decoration: line-through;
      text-decoration-thickness: 1.5px;
    }

    .delete {
      flex-shrink: 0;
      background: #fff1f2;
      color: #ba4758;
      font-size: 14px;
    }

    #empty {
      margin: 28px 0 8px;
      padding: 28px 12px;
      border: 1px dashed #dce2ec;
      border-radius: 14px;
      text-align: center;
      color: #7c879b;
      font-size: 14px;
    }

    #error, #storage-error {
      margin: 10px 0 0;
      color: #b44154;
      font-size: 14px;
      line-height: 1.6;
    }

    :focus-visible {
      outline: 3px solid #a5a0f1;
      outline-offset: 3px;
    }

    @keyframes item-enter {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (hover: hover) {
      .add:hover {
        background: #5144c9;
        transform: translateY(-1px);
      }

      .delete:hover { background: #ffe3e7; }
      .filters button:hover { color: #5146d8; }
      button:active { transform: scale(.95); }
    }

    @media (max-width: 480px) {
      body { padding: 24px 12px; }

      main {
        padding: 24px 16px;
        border-radius: 20px;
      }

      h1 { margin-bottom: 20px; }
      button { padding: 10px 12px; }

      li {
        padding: 10px;
        gap: 8px;
      }

      label { gap: 10px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }

      button:hover, button:active { transform: none; }
    }
  </style>
</head>

<body>
  <main>
    <h1>나의 투두리스트</h1>

    <div class="filters" role="group" aria-label="할 일 상태 필터">
      <button type="button" data-filter="all" aria-pressed="true">
        전체
      </button>
      <button type="button" data-filter="active" aria-pressed="false">
        진행 중
      </button>
      <button type="button" data-filter="completed" aria-pressed="false">
        완료됨
      </button>
    </div>

    <form id="todo-form" novalidate>
      <input
        id="todo-input"
        type="text"
        placeholder="할 일을 입력하세요"
        aria-label="새로운 할 일"
        aria-describedby="error"
        required
      >
      <button type="submit" class="add">추가</button>
    </form>

    <p id="error" role="alert" hidden>할 일을 입력해주세요.</p>
    <p id="storage-error" role="status" hidden></p>
    <ul id="todo-list" aria-label="할 일 목록"></ul>
    <p id="empty" role="status">등록된 할 일이 없습니다.</p>
  </main>

  <script>
    const form = document.querySelector('#todo-form');
    const input = document.querySelector('#todo-input');
    const list = document.querySelector('#todo-list');
    const empty = document.querySelector('#empty');
    const error = document.querySelector('#error');
    const filters = document.querySelectorAll('[data-filter]');
    const storageError = document.querySelector('#storage-error');

    const STORAGE_KEY = 'todo-list-v1';
    let currentFilter = 'all';

    // 필터로 숨겨진 항목까지 포함해 전체 목록을 저장합니다.
    function saveTodos() {
      const todos = Array.from(list.children, item => ({
        text: item.querySelector('span').textContent,
        completed: item.querySelector('input').checked
      }));

      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
        storageError.hidden = true;
      } catch {
        storageError.textContent =
          '목록을 저장하지 못했습니다. 브라우저의 저장 공간 설정을 확인해주세요.';
        storageError.hidden = false;
      }
    }

    // 저장된 목록과 완료 상태를 복원합니다.
    function loadTodos() {
      try {
        const todos = JSON.parse(
          localStorage.getItem(STORAGE_KEY) || '[]'
        );

        if (
          !Array.isArray(todos) ||
          todos.some(todo =>
            !todo ||
            typeof todo.text !== 'string' ||
            !todo.text.trim() ||
            typeof todo.completed !== 'boolean'
          )
        ) {
          throw new Error('Invalid saved todos');
        }

        todos.forEach(todo => addTodo(todo.text, todo.completed));
      } catch {
        storageError.textContent = '저장된 목록을 불러오지 못했습니다.';
        storageError.hidden = false;
      }

      updateFilter();
    }

    // 선택한 상태에 맞는 항목만 표시합니다.
    function updateFilter() {
      let visibleCount = 0;

      for (const item of list.children) {
        const completed = item.querySelector('input').checked;

        const visible =
          currentFilter === 'all' ||
          (currentFilter === 'active' && !completed) ||
          (currentFilter === 'completed' && completed);

        item.hidden = !visible;

        if (visible) visibleCount++;
      }

      empty.hidden = visibleCount > 0;

      empty.textContent =
        currentFilter === 'all'
          ? '등록된 할 일이 없습니다.'
          : currentFilter === 'active'
            ? '진행 중인 할 일이 없습니다.'
            : '완료된 할 일이 없습니다.';

      filters.forEach(button => {
        button.setAttribute(
          'aria-pressed',
          String(button.dataset.filter === currentFilter)
        );
      });
    }

    filters.forEach(button => {
      button.addEventListener('click', () => {
        currentFilter = button.dataset.filter;
        updateFilter();
      });
    });

    input.addEventListener('input', () => {
      error.hidden = true;
      input.removeAttribute('aria-invalid');
    });

    // 할 일 항목을 생성합니다.
    function addTodo(text, completed = false) {
      const item = document.createElement('li');
      const label = document.createElement('label');
      const checkbox = document.createElement('input');
      const task = document.createElement('span');
      const deleteButton = document.createElement('button');

      checkbox.type = 'checkbox';
      checkbox.checked = completed;

      checkbox.addEventListener('change', () => {
        saveTodos();
        updateFilter();
      });

      task.textContent = text;

      deleteButton.type = 'button';
      deleteButton.className = 'delete';
      deleteButton.textContent = '삭제';
      deleteButton.setAttribute('aria-label', `${text} 삭제`);

      deleteButton.addEventListener('click', () => {
        item.remove();
        saveTodos();
        updateFilter();
        input.focus();
      });

      label.append(checkbox, task);
      item.append(label, deleteButton);
      list.append(item);
    }

    // 추가 버튼 클릭과 Enter 키 입력을 함께 처리합니다.
    form.addEventListener('submit', event => {
      event.preventDefault();

      const text = input.value.trim();

      if (!text) {
        error.hidden = false;
        input.setAttribute('aria-invalid', 'true');
        input.focus();
        return;
      }

      addTodo(text);
      saveTodos();

      input.value = '';
      error.hidden = true;
      input.removeAttribute('aria-invalid');

      updateFilter();
      input.focus();
    });

    loadTodos();

    // PWA 서비스 워커 등록: HTTPS 또는 localhost에서 동작합니다.
    if ('serviceWorker' in navigator && window.isSecureContext) {
      window.addEventListener('load', () => {
        navigator.serviceWorker
          .register('./service-worker.js')
          .catch(error => {
            console.error('서비스 워커 등록 실패:', error);
          });
      });
    }
  </script>
</body>
</html>
